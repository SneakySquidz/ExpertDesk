name: Update InforEuro exchange rates

on:
  schedule:
    # 3rd of each month, 06:00 UTC — InforEuro publishes the month's rates
    # at the end of the previous month, so they are always out by then.
    - cron: "0 6 3 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # to trigger the Pages deploy (pushes made with GITHUB_TOKEN don't)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current InforEuro monthly rates
        run: |
          set -euo pipefail
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          curl -sS --fail --retry 3 --retry-delay 10 \
            "https://ec.europa.eu/budg/inforeuro/api/public/monthly-rates?year=${YEAR}&month=${MONTH}&lang=en" \
            -o /tmp/raw.json

          # Refuse to overwrite good data with an empty or partial response.
          COUNT=$(jq 'length' /tmp/raw.json)
          if [ "$COUNT" -lt 100 ]; then
            echo "::error::InforEuro returned only $COUNT currencies for ${YEAR}-${MONTH} — keeping existing rates."
            exit 1
          fi

          {
            echo "// Auto-generated by .github/workflows/update-fx-rates.yml — do not edit by hand."
            echo "// Source: European Commission, InforEuro monthly accounting rates (1 EUR = value units)."
            printf "const FX_RATES = "
            jq -n \
              --arg year "$YEAR" --arg month "$MONTH" \
              --arg fetchedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --slurpfile raw /tmp/raw.json '
              {
                source: "European Commission — InforEuro monthly accounting rates",
                url: "https://commission.europa.eu/funding-and-tenders/procedures-guidelines-tenders/information-contractors-and-beneficiaries/exchange-rate-inforeuro_en",
                year: ($year|tonumber),
                month: ($month|tonumber),
                fetchedAt: $fetchedAt,
                rates: (reduce $raw[0][] as $r ({}; .[$r.isoA3Code] = {value: $r.value, currency: $r.currency, country: $r.country}))
              }'
            echo ";"
          } > fx-rates.js

      - name: Commit if changed, then redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Compare the rates only; fetchedAt changes on every run.
          if git diff -U0 -- fx-rates.js | grep '^[-+] ' | grep -qv fetchedAt; then
            git add fx-rates.js
            git commit -m "Update InforEuro exchange rates ($(date -u +%Y-%m))"
            git push
            gh workflow run deploy-pages.yml --ref main
          else
            echo "No change — InforEuro rates already current."
          fi
